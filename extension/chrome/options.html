<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Café da Firma — Configurações</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <img src="icons/icon-48.png" alt="" width="40" height="40" />
        <div>
          <h1>Café da Firma</h1>
          <p>Configurações da extensão</p>
        </div>
      </header>

      <form id="form">
        <label>
          <span>Endereço do site</span>
          <input
            id="baseUrl"
            type="url"
            placeholder="https://cafe-da-firma.vercel.app"
            spellcheck="false"
            required
          />
          <small>Sem barra no final. Ex.: https://cafe-da-firma.vercel.app</small>
        </label>

        <label>
          <span>Seu nome (opcional)</span>
          <input id="name" type="text" maxlength="20" placeholder="Ex.: Ana" />
          <small>Aparece ao lado dos cafés que você registrar.</small>
        </label>

        <label>
          <span>Avisar depois de</span>
          <select id="remindMin">
            <option value="60">1 hora</option>
            <option value="120">2 horas</option>
            <option value="180">3 horas</option>
            <option value="240">4 horas</option>
            <option value="300">5 horas</option>
            <option value="360">6 horas</option>
          </select>
          <small>Notificação quando o último café passar desse tempo.</small>
        </label>

        <div id="grant" class="grant" hidden>
          <p>
            <strong>Permissão de acesso ao site pendente</strong><br />
            O Firefox não libera isso automaticamente. Clique no botão para
            autorizar.
          </p>
          <button type="button" id="grant-btn">Permitir acesso ao site</button>
        </div>

        <div class="actions">
          <button type="submit" class="primary">Salvar</button>
          <button type="button" id="test" class="ghost">Testar conexão</button>
          <button type="button" id="test-notify" class="ghost">
            Testar notificação
          </button>
          <a id="open-site" class="ghost link" href="#" target="_blank" rel="noreferrer"
            >Abrir site ↗</a
          >
        </div>

        <p id="status" class="status" hidden></p>
      </form>

      <p class="hint">
        Dica: clique com o botão direito no ícone da extensão → “Fixar” para
        deixá-lo sempre visível na barra do navegador.
      </p>
    </div>

    <script src="options.js"></script>
  </body>
</html>
